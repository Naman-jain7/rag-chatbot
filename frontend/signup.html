<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign Up - DocChat</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        surface: '#FFFFFF',
                        'surface-dim': '#F7F8FA',
                        'surface-container': '#F0F2F5',
                        'on-surface': '#1A202C',
                        'on-surface-variant': '#4A5568',
                        primary: '#2D3748',
                        'on-primary': '#FFFFFF',
                        outline: '#CBD5E0',
                        'outline-variant': '#E2E8F0',
                        accent: '#3B82F6'
                    },
                    borderRadius: {
                        DEFAULT: "0.125rem",
                        lg: "0.25rem",
                        xl: "0.5rem",
                        full: "0.75rem"
                    },
                    fontFamily: {
                        headline: ["Inter", "sans-serif"],
                        display: ["Inter", "sans-serif"],
                        body: ["Inter", "sans-serif"],
                        label: ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        /* Custom Utilities */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface-dim min-h-screen flex flex-col font-body text-on-surface selection:bg-accent selection:text-white">
<!-- Minimal Header (Transactional Page - Global Nav Suppressed) -->
<header class="w-full flex justify-between items-center py-6 px-6 md:px-12 absolute top-0 left-0 right-0 z-10">
<div class="text-xl font-headline font-semibold tracking-tight text-primary select-none">
            DocChat
        </div>
<div class="text-sm text-on-surface-variant font-medium">
            Already have an account? <a class="text-primary hover:text-accent transition-colors duration-200 ml-1" href="/login.html">Login</a>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex items-center justify-center p-4 sm:p-6 md:p-8 mt-16 md:mt-0">
<!-- Registration Card -->
<div class="w-full max-w-[480px] bg-surface border border-outline-variant rounded-lg p-8 sm:p-10 shadow-sm relative overflow-hidden">
<!-- Header -->
<div class="mb-8">
<h1 class="text-2xl font-headline font-semibold text-primary mb-2 tracking-tight">Create your account</h1>
<p class="text-base text-on-surface-variant leading-relaxed">Start chatting with your documents today</p>
</div>
<!-- Form -->
<form id="signupForm" class="space-y-5">
<!-- Full Name -->
<div>
<label class="block text-sm font-medium text-primary mb-1.5 font-label tracking-wide" for="name">Full Name</label>
<input class="w-full bg-surface border border-outline rounded-lg px-4 py-2.5 text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-shadow text-sm" id="name" name="name" placeholder="John Doe" type="text"/>
</div>
<!-- Email Address -->
<div>
<label class="block text-sm font-medium text-primary mb-1.5 font-label tracking-wide" for="email">Email Address</label>
<input class="w-full bg-surface border border-outline rounded-lg px-4 py-2.5 text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-shadow text-sm" id="email" name="email" placeholder="you@example.com" type="email"/>
</div>
<!-- Password -->
<div>
<label class="block text-sm font-medium text-primary mb-1.5 font-label tracking-wide" for="password">Password</label>
<div class="relative">
<input class="w-full bg-surface border border-outline rounded-lg pl-4 pr-11 py-2.5 text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-shadow text-sm" id="password" name="password" onkeyup="evaluatePasswordStrength(this.value)" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-on-surface-variant hover:text-primary focus:outline-none transition-colors" onclick="togglePasswordVisibility('password', 'pwd-icon')" type="button">
<span class="material-symbols-outlined text-[20px] select-none" data-icon="visibility_off" id="pwd-icon">visibility_off</span>
</button>
</div>
<!-- Password Strength Indicator -->
<div class="flex gap-1.5 mt-2.5 w-full">
<div class="h-1 w-1/3 bg-outline-variant rounded-full transition-colors duration-300" id="strength-1"></div>
<div class="h-1 w-1/3 bg-outline-variant rounded-full transition-colors duration-300" id="strength-2"></div>
<div class="h-1 w-1/3 bg-outline-variant rounded-full transition-colors duration-300" id="strength-3"></div>
</div>
</div>
<!-- Confirm Password -->
<div>
<label class="block text-sm font-medium text-primary mb-1.5 font-label tracking-wide" for="confirm_password">Confirm Password</label>
<div class="relative">
<input class="w-full bg-surface border border-outline rounded-lg pl-4 pr-11 py-2.5 text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-shadow text-sm" id="confirm_password" name="confirm_password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-on-surface-variant hover:text-primary focus:outline-none transition-colors" onclick="togglePasswordVisibility('confirm_password', 'cpwd-icon')" type="button">
<span class="material-symbols-outlined text-[20px] select-none" data-icon="visibility_off" id="cpwd-icon">visibility_off</span>
</button>
</div>
</div>
<!-- Age -->
<div>
<label class="block text-sm font-medium text-primary mb-1.5 font-label tracking-wide" for="age">Age <span class="text-on-surface-variant font-normal">(optional)</span></label>
<input class="w-full bg-surface border border-outline rounded-lg px-4 py-2.5 text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-shadow text-sm" id="age" name="age" placeholder="e.g. 28" type="number" min="1" max="120"/>
</div>
<!-- Submit Action -->
<div class="pt-4">
<button class="w-full bg-primary text-on-primary font-label font-medium rounded-lg py-3 px-4 hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-200" type="submit">
                        Create Account
                    </button>
</div>
</form>
<!-- Footer Agreement -->
<div class="mt-8 text-center">
<p class="text-xs text-on-surface-variant leading-relaxed">
                    By clicking "Create Account", you agree to our 
                    <a class="text-primary hover:text-accent hover:underline transition-colors" href="#">Terms of Service</a> and 
                    <a class="text-primary hover:text-accent hover:underline transition-colors" href="#">Privacy Policy</a>.
                </p>
</div>
</div>
</main>
<!-- Interactive Scripts -->
<script>
        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility';
                icon.setAttribute('data-icon', 'visibility');
            } else {
                input.type = 'password';
                icon.textContent = 'visibility_off';
                icon.setAttribute('data-icon', 'visibility_off');
            }
        }

        function evaluatePasswordStrength(val) {
            const bar1 = document.getElementById('strength-1');
            const bar2 = document.getElementById('strength-2');
            const bar3 = document.getElementById('strength-3');
            
            // Reset styles
            bar1.className = 'h-1 w-1/3 rounded-full transition-colors duration-300 bg-outline-variant';
            bar2.className = 'h-1 w-1/3 rounded-full transition-colors duration-300 bg-outline-variant';
            bar3.className = 'h-1 w-1/3 rounded-full transition-colors duration-300 bg-outline-variant';

            if (val.length === 0) return;

            let strength = 0;
            if (val.length > 5) strength += 1;
            if (val.length > 8 && /[A-Z]/.test(val) && /[0-9]/.test(val)) strength += 1;
            if (val.length > 10 && /[^A-Za-z0-9]/.test(val)) strength += 1;

            // Using muted/monochrome tones for classic minimal feel instead of vibrant traffic light colors
            if (strength >= 1) {
                bar1.classList.replace('bg-outline-variant', 'bg-primary/40');
            }
            if (strength >= 2) {
                bar1.classList.replace('bg-primary/40', 'bg-primary/70');
                bar2.classList.replace('bg-outline-variant', 'bg-primary/70');
            }
            if (strength >= 3) {
                bar1.classList.replace('bg-primary/70', 'bg-primary');
                bar2.classList.replace('bg-primary/70', 'bg-primary');
                bar3.classList.replace('bg-outline-variant', 'bg-primary');
            }
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirm_password = document.getElementById('confirm_password').value;
            const ageRaw = document.getElementById('age').value.trim();
            
            if (password !== confirm_password) {
                alert("Passwords do not match");
                return;
            }
            if (!name.trim()) {
                alert("Full name is required");
                return;
            }
            if (!email.trim()) {
                alert("Email is required");
                return;
            }
            if (password.length < 8) {
                alert("Password must be at least 8 characters");
                return;
            }
            
            let age = null;
            if (ageRaw !== '') {
                age = parseInt(ageRaw, 10);
                if (isNaN(age) || age < 1 || age > 120) {
                    alert("Please enter a valid age between 1 and 120");
                    return;
                }
            }
            
            try {
                const response = await fetch('/api/v1/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        full_name: name,
                        email: email,
                        password: password,
                        age: age,
                        preferences: {}
                    })
                });
                
                if (response.ok) {
                    window.location.href = '/login.html';
                } else {
                    const err = await response.json();
                    alert("Signup failed: " + (err.detail || "Unknown error"));
                }
            } catch (error) {
                console.error("Signup error:", error);
                alert("An error occurred during signup.");
            }
        });
    </script>
</body></html>
