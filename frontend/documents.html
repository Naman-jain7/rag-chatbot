<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {

                    colors: {
                        "surface": '#FFFFFF',
                        "surface-dim": '#F7F8FA',
                        "surface-container": '#F0F2F5',
                        "on-surface": '#1A202C',
                        "on-surface-variant": '#4A5568',
                        "primary": '#2D3748',
                        "on-primary": '#FFFFFF',
                        "outline": '#CBD5E0',
                        "outline-variant": '#E2E8F0'
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    fontFamily: {
                        "headline": ["Inter", "sans-serif"],
                        "display": ["Inter", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F7F8FA;
            color: #1A202C;
            -webkit-font-smoothing: antialiased;
        }
    </style>
</head>
<body class="bg-surface-dim min-h-screen font-body flex flex-col">
<!-- TopNavBar -->
<nav class="bg-surface text-primary border-b border-outline-variant flex justify-between items-center w-full px-8 py-4 h-16 sticky top-0 z-50">
<div class="flex items-center gap-8">
<div class="text-xl font-headline font-bold tracking-tight text-primary">DocChat</div>
<div class="hidden md:flex gap-6">
<a class="text-on-surface-variant hover:text-primary transition-colors duration-200 font-body font-normal leading-relaxed text-sm" href="/chat.html">Chat</a>
<a class="text-primary font-semibold border-b-2 border-primary pb-1 font-body leading-relaxed text-sm" href="/documents.html">Documents</a>
<a class="text-on-surface-variant hover:text-primary transition-colors duration-200 font-body font-normal leading-relaxed text-sm" href="#">Settings</a>
</div>
</div>
<!-- Search & Actions -->
<div class="flex items-center gap-4">
<div class="relative hidden lg:block">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-sm" style="font-variation-settings: 'FILL' 0;">search</span>
<input class="pl-9 pr-4 py-1.5 bg-surface border border-outline rounded-lg text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary text-on-surface w-48" placeholder="Search..." type="text"/>
</div>
<button class="bg-primary text-on-primary px-4 py-1.5 rounded-lg text-sm font-medium hover:bg-primary/90 transition-colors">
                Upload
            </button>
<div class="h-6 w-px bg-outline-variant mx-2"></div>
<button id="logoutBtn" class="text-on-surface-variant hover:text-primary text-sm font-medium transition-colors">
                Logout
            </button>
<img alt="User profile" class="w-8 h-8 rounded-full ml-2 border border-outline-variant" data-alt="A professional headshot of a person looking directly at the camera. The background is a plain, light color to match the minimalist white theme of the UI. The person has a neutral, approachable expression, suitable for a corporate or professional avatar. The lighting is soft and even, highlighting their features clearly without harsh shadows." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAIOPWpx30GShuvmvSYFdFko6h-6S-X8TQKIYvIFIUzAv35FgY9U6U7JSewEt-nRunYh_m31W3Qt2dcshPTHQUjNikvxCvXYtalOWgnoWZGmdmqVjueajpxkSftD0kMJjMZmpDT0awHJ6LMdzxusNuceeTUgVQ4zTWEpGODoZ4D0M0WqekqUhWPB9f3oA_vm_RB_eKEMow_--ic6hFGsbZ--PfVoAObL5tjx6q3o5oqD-WKgTO4DfzoliQicP3B1nBT7o03rJbfMsW7"/>
</div>
</nav>
<!-- Main Content -->
<main class="flex-1 max-w-7xl w-full mx-auto px-8 py-10">
<!-- Header Section -->
<header class="mb-10 flex flex-col md:flex-row md:items-end justify-between gap-6">
<div>
<h1 class="text-3xl font-headline font-bold text-primary tracking-tight mb-2">My Documents</h1>
<p class="text-on-surface-variant font-body">Manage your uploaded knowledge base</p>
</div>
<!-- Contextual Filter -->
<div class="relative w-full md:w-64">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">filter_list</span>
<input class="w-full pl-10 pr-4 py-2 bg-surface border border-outline rounded-lg text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary shadow-sm" placeholder="Filter documents..." type="text"/>
</div>
</header>
<!-- Upload Zone -->
<section id="uploadZone" class="mb-12 bg-surface border-2 border-dashed border-outline-variant rounded-xl p-12 text-center hover:bg-surface-dim transition-colors duration-200 cursor-pointer group">
<span class="material-symbols-outlined text-4xl text-on-surface-variant mb-4 group-hover:text-primary transition-colors" style="font-variation-settings: 'FILL' 0;">cloud_upload</span>
<h3 class="text-lg font-headline font-semibold text-primary mb-2">Drag and drop files here, or click to browse</h3>
<p class="text-on-surface-variant text-sm mb-6">PDF, DOCX, TXT — max 50MB per file</p>
<input type="file" id="fileInput" multiple accept=".pdf,.txt" style="display:none;">
<button id="uploadBtn" class="border border-primary text-primary px-6 py-2 rounded-lg font-medium hover:bg-surface-container transition-colors">
                Upload Files
            </button>
</section>
<!-- Document Grid -->
<section>
<div id="docsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
<!-- Dynamically populated by JS -->
</div>
</section>
</main>
<script>
    // 1. Auth Protection
    const token = localStorage.getItem('access_token');
    const userId = localStorage.getItem('user_id');
    if (!token || !userId) {
        window.location.href = '/login.html';
    }

    // 2. Logout functionality
    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('access_token');
        localStorage.removeItem('user_id');
        window.location.href = '/login.html';
    });

    // 3. Fetch Documents
    async function fetchDocuments() {
        try {
            const response = await fetch(`/api/v1/documents/${userId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (response.ok) {
                const data = await response.json();
                renderDocuments(data.documents);
            } else if (response.status === 401) {
                window.location.href = '/login.html';
            }
        } catch (error) {
            console.error('Error fetching documents:', error);
        }
    }

    function renderDocuments(docs) {
        const grid = document.getElementById('docsGrid');
        grid.innerHTML = '';
        if (docs.length === 0) {
            grid.innerHTML = '<p class="text-on-surface-variant">No documents uploaded yet.</p>';
            return;
        }

        docs.forEach(doc => {
            const dateStr = new Date(doc.created_at).toLocaleDateString('en-US', {month: 'short', day: 'numeric', year: 'numeric'});
            const isPdf = doc.filename.toLowerCase().endsWith('.pdf');
            const icon = isPdf ? 'picture_as_pdf' : 'article';
            
            grid.innerHTML += `
            <article class="bg-surface border border-outline-variant rounded-lg p-5 hover:shadow-md transition-shadow duration-200 group relative flex flex-col justify-between h-40">
                <div class="flex items-start justify-between">
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">${icon}</span>
                        <div>
                            <h4 class="font-headline font-medium text-primary text-sm truncate w-40" title="${doc.filename}">${doc.filename}</h4>
                            <p class="text-xs text-on-surface-variant mt-0.5">Uploaded</p>
                        </div>
                    </div>
                    <button aria-label="Delete" onclick="deleteDocument('${doc.filename}')" class="text-outline hover:text-red-500 transition-colors opacity-0 group-hover:opacity-100">
                        <span class="material-symbols-outlined text-[20px]">delete</span>
                    </button>
                </div>
                <div class="text-xs text-on-surface-variant flex items-center gap-1.5 border-t border-outline-variant pt-3 mt-4">
                    <span class="material-symbols-outlined text-[14px]">calendar_today</span>
                    ${dateStr}
                </div>
            </article>`;
        });
    }

    // 4. File Upload
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const uploadZone = document.getElementById('uploadZone');

    uploadBtn.addEventListener('click', () => fileInput.click());
    uploadZone.addEventListener('click', (e) => {
        if (e.target !== uploadBtn) fileInput.click();
    });

    fileInput.addEventListener('change', async (e) => {
        if (!e.target.files.length) return;
        
        for (let file of e.target.files) {
            const formData = new FormData();
            formData.append('user_id', userId);
            formData.append('file', file);
            
            try {
                // Change UI to loading state if desired
                const response = await fetch('/api/v1/upload', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });
                if (!response.ok) {
                    const err = await response.json();
                    alert(`Failed to upload ${file.name}: ${err.detail}`);
                }
            } catch (err) {
                console.error(err);
                alert(`Error uploading ${file.name}`);
            }
        }
        fileInput.value = ''; // Reset input
        fetchDocuments(); // Refresh grid
    });

    // 5. Delete Document
    async function deleteDocument(filename) {
        if (!confirm(`Are you sure you want to delete ${filename}?`)) return;
        
        try {
            const response = await fetch(`/api/v1/delete?user_id=${userId}`, {
                method: 'POST',
                headers: { 
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify([filename])
            });
            
            if (response.ok) {
                fetchDocuments();
            } else {
                alert("Failed to delete document");
            }
        } catch (err) {
            console.error(err);
            alert("Error deleting document");
        }
    }

    // Initial load
    fetchDocuments();
</script>
</body></html>
