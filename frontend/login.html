<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>DocChat - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        surface: '#FFFFFF',
                        'surface-dim': '#F7F8FA',
                        'surface-container': '#F0F2F5',
                        'on-surface': '#1A202C',
                        'on-surface-variant': '#4A5568',
                        primary: '#2D3748',
                        'on-primary': '#FFFFFF',
                        outline: '#CBD5E0',
                        'outline-variant': '#E2E8F0',
                        accent: '#3B82F6'
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem", // 4px based on instructions
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    fontFamily: {
                        "headline": ["Inter", "sans-serif"],
                        "display": ["Inter", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-surface-dim min-h-screen flex flex-col text-on-surface">
<!-- Navbar Structure (derived from intent, transactional so mostly hidden, but user explicitly asked for logo and sign up link) -->
<header class="w-full flex justify-between items-center px-6 py-4 bg-surface border-b border-outline-variant max-w-full">
<div class="text-xl font-bold text-primary font-headline tracking-tight">DocChat</div>
<div class="text-sm font-body text-on-surface-variant font-medium">
            New here? <a class="text-primary hover:text-accent transition-colors font-semibold" href="/signup.html">Sign Up</a>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-4">
<!-- Login Card -->
<div class="w-full max-w-[440px] bg-surface border border-outline-variant rounded p-8 flex flex-col gap-6">
<!-- Header -->
<div class="text-center">
<h1 class="text-2xl font-headline font-semibold text-primary tracking-tight mb-2">Welcome back</h1>
<p class="text-on-surface-variant font-body">Sign in to your DocChat account</p>
</div>
<!-- Form -->
<form id="loginForm" class="flex flex-col gap-4">
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="text-sm font-label font-medium text-on-surface" for="email">Email Address</label>
<input class="w-full bg-surface border border-outline rounded px-3 py-2 text-on-surface font-body placeholder:text-outline focus:border-accent focus:ring-1 focus:ring-accent outline-none transition-shadow" id="email" placeholder="you@example.com" type="email"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5 relative">
<label class="text-sm font-label font-medium text-on-surface" for="password">Password</label>
<div class="relative">
<input class="w-full bg-surface border border-outline rounded px-3 py-2 text-on-surface font-body placeholder:text-outline focus:border-accent focus:ring-1 focus:ring-accent outline-none transition-shadow pr-10" id="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 flex items-center pr-3 text-on-surface-variant hover:text-primary focus:outline-none" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="visibility-icon">visibility</span>
</button>
</div>
<div class="text-right mt-1">
<a class="text-sm font-body text-on-surface-variant hover:text-primary transition-colors" href="#">Forgot password?</a>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-label font-medium py-2.5 rounded mt-2 hover:bg-opacity-90 active:opacity-80 transition-opacity" type="submit">
                    Sign In
                </button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 px-4 text-sm font-body text-on-surface-variant bg-surface">or</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- SSO Button -->
<button class="w-full bg-surface border border-outline-variant text-on-surface font-label font-medium py-2.5 rounded flex items-center justify-center gap-2 hover:bg-surface-container active:bg-surface-dim transition-colors" type="button">
<svg height="18px" viewbox="0 0 48 48" width="18px" xmlns="http://www.w3.org/2000/svg">
<path d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z" fill="#FFC107"></path>
<path d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z" fill="#FF3D00"></path>
<path d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z" fill="#4CAF50"></path>
<path d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z" fill="#1976D2"></path>
</svg>
                Continue with Google
            </button>
</div>
</main>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibility-icon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const formData = new URLSearchParams();
            formData.append('username', email);
            formData.append('password', password);
            
            try {
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });
                
                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('user_id', data.user_id);
                    window.location.href = '/documents.html';
                } else {
                    const err = await response.json();
                    alert("Login failed: " + (err.detail || "Invalid credentials"));
                }
            } catch (error) {
                console.error("Login error:", error);
                alert("An error occurred during login.");
            }
        });
    </script>
</body></html>
