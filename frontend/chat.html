<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        surface: '#FFFFFF',
                        'surface-dim': '#F7F8FA',
                        'surface-container': '#F0F2F5',
                        'on-surface': '#1A202C',
                        'on-surface-variant': '#4A5568',
                        primary: '#2D3748',
                        'on-primary': '#FFFFFF',
                        outline: '#CBD5E0',
                        'outline-variant': '#E2E8F0'
                    },
                    borderRadius: {
                        DEFAULT: "0.125rem",
                        lg: "0.25rem",
                        xl: "0.5rem",
                        full: "0.75rem"
                    },
                    fontFamily: {
                        headline: ["Inter", "sans-serif"],
                        display: ["Inter", "sans-serif"],
                        body: ["Inter", "sans-serif"],
                        label: ["Inter", "sans-serif"]
                    }
                }
            }

<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-surface text-on-surface h-screen flex overflow-hidden antialiased font-body">
<!-- TopNavBar (Hidden on Mobile, Visible on Web as requested by logic, though prompt asked for fixed left sidebar. Fulfilling JSON logic where TopNavBar is present) -->
<header class="hidden md:flex fixed top-0 right-0 left-64 h-16 items-center justify-between px-6 z-10 bg-surface dark:bg-surface border-b border-outline-variant text-primary dark:text-primary">
<div class="flex items-center space-x-6">
<h1 class="text-xl font-headline font-semibold text-primary dark:text-primary tracking-tight">DocChat</h1>
<nav class="flex space-x-4">
<a class="text-on-surface-variant hover:text-on-surface hover:text-primary transition-colors text-sm font-medium" href="#">Models</a>
<a class="text-on-surface-variant hover:text-on-surface hover:text-primary transition-colors text-sm font-medium" href="#">Integrations</a>
<a class="text-on-surface-variant hover:text-on-surface hover:text-primary transition-colors text-sm font-medium" href="#">Usage</a>
</nav>
</div>
<div class="flex items-center space-x-4">
<button class="text-sm font-medium hover:text-primary transition-colors cursor-pointer active:scale-95">Export</button>
<button class="cursor-pointer active:scale-95 text-on-surface-variant hover:text-on-surface"><span class="material-symbols-outlined text-lg">share</span></button>
<button class="cursor-pointer active:scale-95 text-on-surface-variant hover:text-on-surface"><span class="material-symbols-outlined text-lg">more_vert</span></button>
<div class="w-8 h-8 rounded-full bg-outline-variant overflow-hidden">
<img alt="User" class="w-full h-full object-cover" data-alt="A professional headshot of a person looking directly at the camera. The lighting is soft and flattering, suitable for a corporate profile. The background is a clean, neutral gray tone that matches a minimalist design system. The person exudes competence and trustworthiness." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB-AyuNZJjavYfK0C8aEYylUIdoYC7LjLeXXV36paa95Stps6MxFYYkp15fsoUouGeh6o7qS8BrkEWdLNshP6PDHoFk98hdf8WO21nXqZ90TtRiV1C_yJyX6o6Q1h0hdrIr3fQ8BNYsPoC9XqYMVCx8i1zfM3d4nJXFWEL44sUCCDAwRC4zJV1roP1mmO8FzGfPSo5anf8s0LJenO8o_64BS7QPwSS1AvsXnEj1Am0f0uT2zUmkO6MtKt_EqMscv89SR3o_LiZsmaGS"/>
</div>
</div>
</header>
<!-- SideNavBar -->
<aside class="fixed inset-y-0 left-0 flex flex-col h-screen w-64 border-r border-outline-variant bg-surface-dim dark:bg-surface-dim text-primary dark:text-primary z-20">
<div class="p-4 border-b border-outline-variant flex items-center space-x-3">
<div class="w-8 h-8 bg-primary rounded flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined text-sm">robot_2</span>
</div>
<div>
<div class="text-lg font-headline font-semibold text-primary dark:text-primary tracking-tight">DocChat</div>
<div class="font-body text-xs text-on-surface-variant">Professional RAG Bot</div>
</div>
</div>
<div class="p-4">
<button id="newChatBtn" class="w-full bg-primary text-on-primary rounded py-2 px-4 flex items-center justify-center space-x-2 hover:bg-opacity-90 transition-colors font-medium text-sm">
<span class="material-symbols-outlined text-sm">add</span>
<span>New Chat</span>
</button>
</div>
<nav class="flex-1 overflow-y-auto py-2">
<!-- Nav Items -->
<a class="flex items-center space-x-3 px-4 py-2 opacity-80 transition-all hover:bg-surface-container transition-colors duration-200 text-on-surface-variant hover:text-on-surface" href="/documents.html">
<span class="material-symbols-outlined text-lg">description</span>
<span class="text-sm font-body">Documents</span>
</a>
<a class="flex items-center space-x-3 px-4 py-2 opacity-80 transition-all hover:bg-surface-container transition-colors duration-200 text-on-surface-variant hover:text-on-surface" href="#">
<span class="material-symbols-outlined text-lg">settings</span>
<span class="text-sm font-body">Settings</span>
</a>
<!-- Recent Chats section (populated dynamically) -->
<div class="mt-6 px-4">
<h3 class="font-label uppercase tracking-wider text-xs text-on-surface-variant mb-2">Recent Chats</h3>
<div id="recentChatsList" class="space-y-1">
<!-- Chat history items will appear here -->
</div>
</div>
</nav>
<div class="p-4 border-t border-outline-variant">
<a class="flex items-center space-x-3 py-2 text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-colors duration-200 px-2 rounded" href="#">
<span class="material-symbols-outlined text-lg">person</span>
<span class="text-sm font-body">Account</span>
</a>
<a id="logoutBtn" class="flex items-center space-x-3 py-2 text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-colors duration-200 px-2 rounded" href="#">
<span class="material-symbols-outlined text-lg">logout</span>
<span class="text-sm font-body">Log out</span>
</a>
</div>
</aside>
<!-- Main Content Area -->
<main class="flex-1 ml-64 flex flex-col overflow-hidden" style="height:100vh; padding-top:4rem;">
<!-- Main Area Header -->
<div class="px-8 py-5 border-b border-outline-variant bg-surface flex justify-between items-center shrink-0">
<div>
<h2 id="chatTitle" class="text-xl font-headline font-semibold text-primary tracking-tight">New Chat</h2>
<div id="chatSourcePills" class="flex space-x-2 mt-1"></div>
</div>
<div class="flex space-x-2">
<button class="p-2 text-on-surface-variant hover:bg-surface-container rounded transition-colors"><span class="material-symbols-outlined text-xl">share</span></button>
<button id="clearChatBtn" class="p-2 text-on-surface-variant hover:bg-surface-container rounded transition-colors" title="Clear chat"><span class="material-symbols-outlined text-xl">delete_sweep</span></button>
</div>
</div>
<!-- Chat Feed -->
<div id="chatFeed" class="flex-1 overflow-y-auto p-8 bg-surface space-y-6">
<!-- Dynamically populated by JS -->
</div>
<!-- Input Bar (part of flex column, always visible) -->
<div class="shrink-0 bg-surface border-t border-outline-variant px-4 py-3 md:px-6 md:py-4">
<div class="max-w-4xl mx-auto relative flex items-center">
<button class="absolute left-3 text-on-surface-variant hover:text-primary transition-colors p-1">
<span class="material-symbols-outlined">attach_file</span>
</button>
<input id="chatInput" class="w-full bg-surface-dim border border-outline-variant rounded-lg pl-12 pr-14 py-3 text-sm focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary placeholder-on-surface-variant text-on-surface" placeholder="Ask a question about your documents..." type="text"/>
<button id="sendBtn" class="absolute right-3 bg-primary text-on-primary rounded p-2 hover:bg-opacity-90 transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-sm">send</span>
</button>
</div>
<div class="text-center mt-2 text-[10px] text-on-surface-variant">
    DocChat can make mistakes. Consider verifying important information against the source documents.
</div>
</div>
</main>
<script>
    // 1. Auth Protection
    const token = localStorage.getItem('access_token');
    const userId = localStorage.getItem('user_id');
    if (!token || !userId) {
        window.location.href = '/login.html';
    }

    // 2. Logout functionality
    document.getElementById('logoutBtn').addEventListener('click', (e) => {
        e.preventDefault();
        localStorage.removeItem('access_token');
        localStorage.removeItem('user_id');
        window.location.href = '/login.html';
    });

    // 3. Chat Elements
    const chatFeed = document.getElementById('chatFeed');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const chatTitle = document.getElementById('chatTitle');
    const chatSourcePills = document.getElementById('chatSourcePills');
    const newChatBtn = document.getElementById('newChatBtn');
    const clearChatBtn = document.getElementById('clearChatBtn');

    // 4. New Chat — clears the feed and resets the header
    function startNewChat() {
        chatFeed.innerHTML = '';
        chatTitle.textContent = 'New Chat';
        chatSourcePills.innerHTML = '';
        chatInput.value = '';
        chatInput.focus();
    }

    newChatBtn.addEventListener('click', startNewChat);
    clearChatBtn.addEventListener('click', startNewChat);

    // 5. Message rendering
    function appendUserMessage(text) {
        const div = document.createElement('div');
        div.className = 'flex justify-end';
        div.innerHTML = `<div class="max-w-[70%] bg-surface-container border border-outline-variant rounded-lg rounded-tr-none px-5 py-4 text-on-surface text-sm leading-relaxed whitespace-pre-wrap">${escapeHtml(text)}</div>`;
        chatFeed.appendChild(div);
        scrollToBottom();
    }

    function appendAiMessageContainer(id) {
        chatFeed.innerHTML += `
        <div class="flex justify-start">
            <div class="flex space-x-4 max-w-[80%]">
                <div class="w-8 h-8 bg-primary rounded-full flex-shrink-0 flex items-center justify-center text-on-primary">
                    <span class="material-symbols-outlined text-sm">robot_2</span>
                </div>
                <div id="${id}" class="bg-surface border border-outline-variant rounded-lg rounded-tl-none px-6 py-5 text-on-surface text-sm leading-relaxed shadow-sm whitespace-pre-wrap"></div>
            </div>
        </div>`;
        scrollToBottom();
    }

    function appendTypingIndicator() {
        const div = document.createElement('div');
        div.id = 'typingIndicator';
        div.className = 'flex justify-start';
        div.innerHTML = `
        <div class="flex space-x-4 max-w-[80%]">
            <div class="w-8 h-8 bg-primary rounded-full flex-shrink-0 flex items-center justify-center text-on-primary">
                <span class="material-symbols-outlined text-sm">robot_2</span>
            </div>
            <div class="bg-surface border border-outline-variant rounded-lg rounded-tl-none px-6 py-4 text-on-surface-variant text-sm italic">Thinking...</div>
        </div>`;
        chatFeed.appendChild(div);
        scrollToBottom();
    }

    function removeTypingIndicator() {
        const indicator = document.getElementById('typingIndicator');
        if (indicator) indicator.remove();
    }

    function scrollToBottom() {
        chatFeed.scrollTop = chatFeed.scrollHeight;
    }

    function escapeHtml(text) {
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return text.replace(/[&<>"']/g, m => map[m]);
    }

    // 6. Send message
    async function sendMessage() {
        const query = chatInput.value.trim();
        if (!query) return;

        // Update title on first message
        if (chatFeed.children.length === 0) {
            chatTitle.textContent = query.length > 40 ? query.substring(0, 40) + '…' : query;
        }

        appendUserMessage(query);
        chatInput.value = '';
        sendBtn.disabled = true;
        appendTypingIndicator();

        try {
            const response = await fetch('/api/v1/chat/chat', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ user_id: parseInt(userId), query: query })
            });

            removeTypingIndicator();
            if (response.ok) {
                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                const msgId = 'msg-' + Date.now();
                appendAiMessageContainer(msgId);
                const container = document.getElementById(msgId);
                
                let done = false;
                while (!done) {
                    const { value, done: readerDone } = await reader.read();
                    done = readerDone;
                    if (value) {
                        const chunk = decoder.decode(value, {stream: true});
                        container.innerHTML += chunk.replace(/</g, "&lt;").replace(/>/g, "&gt;"); // Basic escape
                        scrollToBottom();
                    }
                }
            } else {
                appendAiMessageContainer('err-' + Date.now());
                document.getElementById('err-' + Date.now()).innerText = "Sorry, I encountered an error. Please try again.";
            }
        } catch (error) {
            console.error('Chat error:', error);
            const errId = 'err-' + Date.now();
            appendAiMessageContainer(errId);
            document.getElementById(errId).innerText = "Failed to connect to the server.";
        } finally {
            sendBtn.disabled = false;
            chatInput.focus();
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
</script>
</body></html>
